name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; nothing in CI needs write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.check_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Preserve the names required by main's branch protection.
          - os: ubuntu-latest
            node: "22.15.0"
            check_name: check (ubuntu-latest)
          - os: macos-latest
            node: "22.15.0"
            check_name: check (macos-latest)
          - os: ubuntu-latest
            node: "24"
            check_name: check (ubuntu-latest, Node 24)
          - os: macos-latest
            node: "24"
            check_name: check (macos-latest, Node 24)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test tarball
        run: ./scripts/smoke-tarball.sh
